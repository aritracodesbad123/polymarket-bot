[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polygrok"
version = "0.1.0"
description = "Autonomous Polymarket trading bot (paper-first, fail-closed live lock)"
requires-python = ">=3.11"
dependencies = [
    "polymarket-client",
    "xai-sdk",
    "pydantic>=2",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
polygrok = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["storage/schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
